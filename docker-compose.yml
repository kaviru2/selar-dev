# SELAR Docker Compose — Development Environment
# Orchestrates three services: Postgres (with pgvector), Go API, and Next.js console.
# Usage: docker compose up --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: selar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-selar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selar_dev}
      POSTGRES_DB: ${POSTGRES_DB:-selar}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/selar-api/internal/store/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./services/selar-api/internal/store/migrations/002_add_summary.sql:/docker-entrypoint-initdb.d/002_add_summary.sql
      - ./services/selar-api/internal/store/migrations/003_runtime_mental_model.sql:/docker-entrypoint-initdb.d/003_runtime_mental_model.sql
      - ./services/selar-api/internal/store/migrations/004_adaptive_chat.sql:/docker-entrypoint-initdb.d/004_adaptive_chat.sql
      - ./services/selar-api/internal/store/migrations/005_chat_graph_reducer.sql:/docker-entrypoint-initdb.d/005_chat_graph_reducer.sql
      - ./services/selar-api/internal/store/migrations/006_graph_governance.sql:/docker-entrypoint-initdb.d/006_graph_governance.sql
      - ./services/selar-api/internal/store/migrations/007_multimodal_sources.sql:/docker-entrypoint-initdb.d/007_multimodal_sources.sql
      - ./services/selar-api/internal/store/migrations/008_grounded_chat_concepts.sql:/docker-entrypoint-initdb.d/008_grounded_chat_concepts.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-selar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  selar-api:
    container_name: selar-api
    build:
      context: ./services/selar-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-selar}:${POSTGRES_PASSWORD:-selar_dev}@postgres:5432/${POSTGRES_DB:-selar}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      WORKER_URL: http://selar-worker:8000
    volumes:
      - selar_uploads:/tmp/selar_uploads
    depends_on:
      postgres:
        condition: service_healthy
      selar-worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  selar-console:
    container_name: selar-console
    build:
      context: ./services/selar-console
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CONSOLE_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      API_INTERNAL_URL: http://selar-api:8080
    depends_on:
      selar-api:
        condition: service_healthy

  selar-worker:
    container_name: selar-worker
    build:
      context: ./services/selar-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-selar}:${POSTGRES_PASSWORD:-selar_dev}@postgres:5432/${POSTGRES_DB:-selar}?sslmode=disable
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MULTIMODAL_EMBEDDING_MODEL: ${GEMINI_MULTIMODAL_EMBEDDING_MODEL:-gemini-embedding-2}
      INGESTION_CONCURRENCY: ${INGESTION_CONCURRENCY:-1}
    volumes:
      - selar_uploads:/tmp/selar_uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  selar_uploads:

name: Bug Report
description: Create a report to help us improve and fix bugs in SELAR
title: "[Bug] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please use this form to provide clear and actionable details.

  - type: textarea
    id: bug_description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: "The application crashes when..."
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Please explain the steps required to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SELAR Version or Environment
      description: What version or branch were you on? Did this occur locally, in Docker, or in Staging?
      placeholder: "e.g., v0.1.0, main branch locally with docker-compose"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser (If frontend issue)
      description: Select the browser you experienced the bug in.
      options:
        - "Chrome / Brave / Edge (Chromium)"
        - "Firefox"
        - "Safari"
        - "Not applicable (Backend/Worker issue)"
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context / Screenshots
      description: Add any other context about the problem here, including stack traces or screenshots.
    validations:
      required: false

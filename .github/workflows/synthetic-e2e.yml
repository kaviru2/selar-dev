name: Synthetic service E2E
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  service-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: selar_e2e
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: selar_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selar_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://selar_e2e:synthetic_ci_only@localhost:5432/selar_e2e?sslmode=disable
      DATABASE_URL: postgres://selar_e2e:synthetic_ci_only@localhost:5432/selar_e2e?sslmode=disable
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      SELAR_SYNTHETIC_E2E: "1"
      TEST_API_BINARY: ${{ github.workspace }}/services/selar-api/selar-e2e-api
      TEST_CONSOLE_DIR: ${{ github.workspace }}/services/selar-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/selar-api/go.mod
          cache-dependency-path: services/selar-api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - name: Apply every production migration to isolated pgvector
        run: |
          for migration in services/selar-api/internal/store/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
      - name: Build real API and console
        run: |
          (cd services/selar-api && go build -o "$TEST_API_BINARY" ./cmd/server)
          (cd services/selar-console && pnpm install --frozen-lockfile && pnpm build)
      - name: Install worker and browser dependencies
        run: |
          python -m pip install -r services/selar-worker/requirements.txt pytest pytest-timeout playwright
          python -m playwright install --with-deps chromium
      - name: Run actual service-boundary scenario
        working-directory: services/selar-worker
        run: python -m pytest -vv -s test_synthetic_service_e2e.py

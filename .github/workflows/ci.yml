name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

jobs:
  build-api:
    name: Build Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/selar-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: services/selar-api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1

      - name: Vet
        run: go vet ./...

  build-console:
    name: Build Next.js Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/selar-console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  check-worker:
    name: Check Python Worker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: selar_test
          POSTGRES_PASSWORD: selar_test
          POSTGRES_DB: selar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://selar_test:selar_test@localhost:5432/selar_test?sslmode=disable
    defaults:
      run:
        working-directory: services/selar-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/selar-api/go.sum

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Apply database migrations with the checksum-tracked runner
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" go run ./cmd/migrate
          # A second run must be a no-op (idempotence).
          DATABASE_URL="$TEST_DATABASE_URL" go run ./cmd/migrate 2>&1 | tee second-run.log
          grep -q "0 adopted, 0 applied" second-run.log
          DATABASE_URL="$TEST_DATABASE_URL" go run ./cmd/migrate -status 2>&1 | grep -q ", 0 pending"
        working-directory: services/selar-api

      - name: Test migration runner, compiled API boot and direct uploads against Postgres
        run: go test ./internal/migrate ./cmd/server ./internal/handler -v -count=1
        working-directory: services/selar-api

      - name: Test real Go graph and review store against Postgres
        run: go test ./internal/store -run 'TestGroundedReview|TestGroundedChatConceptDiscoveryIntegration|TestChatGraphSafety' -v -count=1
        working-directory: services/selar-api

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Check imports
        run: python -c "import main"

      - name: Test worker and durable queue
        run: pytest -q

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

# Keep manual @claude requests independent of automatic PR reviews.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    name: Claude / PR Review
    # Opt in after configuring credentials (see docs/CI.md). Manual mentions
    # remain available independently; the credential guard still fails closed.
    if: |
      (github.event_name == 'pull_request' &&
       vars.CLAUDE_REVIEW_ENABLED == 'true' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check review credentials
        id: review-config
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Claude review skipped because CLAUDE_CODE_OAUTH_TOKEN is not configured"
          fi

      - name: Run Claude Code Review
        if: steps.review-config.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review this pull request. Focus on:
            - Correctness and logic errors
            - Security vulnerabilities (OWASP top 10, injection, auth issues)
            - Go idioms and error handling (selar-api)
            - React/Next.js best practices and accessibility (selar-console)
            - Python code quality (selar-worker)
            - Any breaking changes to interfaces or APIs

            Be concise. Group findings by severity: **Critical**, **Warning**, **Suggestion**.
            If the PR looks good, say so briefly.
          use_sticky_comment: true

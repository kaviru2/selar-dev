<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>SELAR — Design canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  :root { --sans: "Inter", ui-sans-serif, system-ui, sans-serif; --serif: "Source Serif 4", Georgia, serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; }
  html, body { height: 100%; margin: 0; background: #f0eee9; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="paper-content.jsx"></script>
<script type="text/babel" src="sidebar.jsx"></script>
<script type="text/babel" src="topbar.jsx"></script>
<script type="text/babel" src="reader.jsx"></script>
<script type="text/babel" src="matches-panel.jsx"></script>
<script type="text/babel" src="library-view.jsx"></script>
<script type="text/babel" src="graph-view.jsx"></script>
<script type="text/babel" src="quiz-view.jsx"></script>
<script type="text/babel" src="other-views.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel">
  const AB = ({ view, cohort, matchesStyle, w=1440, h=900, children }) => (
    <div style={{ width: w, height: h, overflow: 'hidden' }}>
      <SelarApp initialView={view} initialCohort={cohort} initialMatchesStyle={matchesStyle} showTweaks={false}/>
    </div>
  );

  const App = () => (
    <DesignCanvas>
      <DCSection id="hero" title="Reader · HITL confirmation loop" subtitle="The core intervention — user confirms AI-surfaced semantic matches">
        <DCArtboard id="hero-cards"    label="A · Cards + similarity bars (hero)"  width={1440} height={900}>
          <AB view="reader" cohort="treatment_hitl" matchesStyle="cards"/>
        </DCArtboard>
        <DCArtboard id="hero-diff"     label="B · Side-by-side diff"                width={1440} height={900}>
          <AB view="reader" cohort="treatment_hitl" matchesStyle="diff"/>
        </DCArtboard>
        <DCArtboard id="hero-keyboard" label="C · Keyboard-driven queue"            width={1440} height={900}>
          <AB view="reader" cohort="treatment_hitl" matchesStyle="keyboard"/>
        </DCArtboard>
        <DCArtboard id="hero-feed"     label="D · Stacked feed (dense)"             width={1440} height={900}>
          <AB view="reader" cohort="treatment_hitl" matchesStyle="feed"/>
        </DCArtboard>
        <DCArtboard id="hero-popover"  label="E · Inline popover (anchored)"        width={1440} height={900}>
          <AB view="reader" cohort="treatment_hitl" matchesStyle="popover"/>
        </DCArtboard>
      </DCSection>

      <DCSection id="cohorts" title="Three-arm cohorts" subtitle="Same document, three UI conditions — the independent variable">
        <DCArtboard id="ctrl" label="Control · plain reader"  width={1440} height={900}>
          <AB view="reader" cohort="control" matchesStyle="cards"/>
        </DCArtboard>
        <DCArtboard id="auto" label="Auto · links pre-applied" width={1440} height={900}>
          <AB view="reader" cohort="treatment_auto" matchesStyle="cards"/>
        </DCArtboard>
        <DCArtboard id="hitl" label="HITL · user confirms"     width={1440} height={900}>
          <AB view="reader" cohort="treatment_hitl" matchesStyle="cards"/>
        </DCArtboard>
      </DCSection>

      <DCSection id="dark" title="Dark mode" subtitle="Same screens, inverted palette — late-night study sessions">
        <DCArtboard id="dk-reader"  label="Reader · HITL · dark"  width={1440} height={900}>
          <div className="theme-dark" style={{ width: '100%', height: '100%' }}>
            <AB view="reader" cohort="treatment_hitl" matchesStyle="cards"/>
          </div>
        </DCArtboard>
        <DCArtboard id="dk-library" label="Library · dark"        width={1440} height={900}>
          <div className="theme-dark" style={{ width: '100%', height: '100%' }}>
            <AB view="library"/>
          </div>
        </DCArtboard>
        <DCArtboard id="dk-graph"   label="Graph · dark"          width={1440} height={900}>
          <div className="theme-dark" style={{ width: '100%', height: '100%' }}>
            <AB view="graph"/>
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="views" title="Supporting views" subtitle="Library · Onboarding · Graph · Quiz · Settings">
        <DCArtboard id="onboard"  label="Onboarding"     width={1440} height={900}>
          <AB view="onboard"/>
        </DCArtboard>
        <DCArtboard id="library"  label="Library"        width={1440} height={900}>
          <AB view="library"/>
        </DCArtboard>
        <DCArtboard id="graph"    label="Knowledge graph" width={1440} height={900}>
          <AB view="graph"/>
        </DCArtboard>
        <DCArtboard id="quiz"     label="Retention quiz"  width={1440} height={900}>
          <AB view="quiz"/>
        </DCArtboard>
        <DCArtboard id="settings" label="Settings"        width={1440} height={900}>
          <AB view="settings"/>
        </DCArtboard>
      </DCSection>

      <DCPostIt top={180} left={40} rotate={-4}>Start with Cards (A). It's the default the 45-day plan builds toward.</DCPostIt>
      <DCPostIt top={1080} left={40} rotate={3}>Cohort gating happens in one place — `cohort !== 'control'` hides the whole right rail.</DCPostIt>
      <DCPostIt top={1980} left={40} rotate={-2}>Graph uses an SVG stand-in for react-force-graph. Swap at build time.</DCPostIt>
    </DesignCanvas>
  );
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
